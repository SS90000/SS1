name: Daily data update

on:
  schedule:
    - cron: "34 10 * * *"   # 10:34 UTC = 6:34 am Toronto (EDT), 5:34 am in winter
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Keep a copy of the current data
        run: cp data.json /tmp/data.before.json

      - name: Prepare the Claude token (does not print it)
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re
          raw = os.environ.get("T", "")
          joined = "".join(raw.split())          # remove spaces and line breaks added by copy-paste
          m = re.search(r"sk-ant-[A-Za-z0-9_\-]+", joined)
          print("Secret length:", len(raw), "| after removing spaces/line breaks:", len(joined))
          print("Found sk-ant- in the secret:", bool(m))
          if m:
              print("Characters before sk-ant- (ignored):", m.start(), "| after the token (ignored):", len(joined) - m.end())
              print("Cleaned token length:", len(m.group(0)))
              print("::add-mask::" + m.group(0))
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("CLAUDE_CODE_OAUTH_TOKEN=" + m.group(0) + "\n")
          else:
              raise SystemExit("The saved secret does not contain a token starting with sk-ant-. Create a new token and save it again.")
          PY

      - name: Check sources and update data.json
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "claude[bot]"
          prompt: "Read .github/daily-update.md and carry out the daily update it describes, editing only data.json."
          claude_args: |
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(curl:*),Bash(python3:*),Bash(date:*),Bash(ls:*),Bash(cat:*)"

      - name: Validate data.json
        run: python3 .github/validate.py /tmp/data.before.json data.json

      - name: Save the update
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No change to data.json"
          else
            git commit -m "Daily data update $(date -u +%F)"
            git push
          fi
